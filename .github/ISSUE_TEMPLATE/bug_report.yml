name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here. Use the Security tab > "Report a vulnerability" instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Routes
        2. Add a route for ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RyProx version
      description: Output of `ryprox version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run RyProx?
      options:
        - Docker / Docker Compose
        - Binary
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove any secrets, tokens or private hostnames first.
      render: text

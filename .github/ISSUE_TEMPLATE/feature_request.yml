name: Feature request
description: Suggest an idea for RyProx
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work in the UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
  - type: checkboxes
    id: cleanroom
    attributes:
      label: Clean-room check
      options:
        - label: This idea is based on public information or my own needs, not on another product's source code.
          required: true

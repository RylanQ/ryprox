version: "2"

linters:
  enable:
    - gosec        # security problems
    - bodyclose    # unclosed HTTP response bodies
    - errorlint    # correct error wrapping
    - misspell
    - revive
    - unconvert
    - noctx        # HTTP requests without a context

  exclusions:
    rules:
      # Tests deliberately build odd inputs and simple connections.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
